<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqbal App Hub - Play Store Pro</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Roboto, sans-serif; }
        body { background-color: #f8f9fa; color: #202124; padding-bottom: 90px; }
        
        /* Top Header */
        .top-header { background: #ffffff; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; position: sticky; top: 0; z-index: 100; }
        .brand-title { font-size: 20px; font-weight: 500; color: #1a73e8; }
        
        /* Search Bar Section */
        .search-section { padding: 10px 16px; background: #fff; display: none; border-bottom: 1px solid #e0e0e0; }
        .search-box { width: 100%; padding: 10px 16px; border-radius: 24px; border: 1px solid #dadce0; font-size: 15px; outline: none; background: #f1f3f4; }
        .search-box:focus { background: #fff; border-color: #1a73e8; box-shadow: 0 1px 3px rgba(26,115,232,0.2); }

        /* Banner Style */
        .banner-container { width: 100%; padding: 12px 16px; background: #fff; }
        .banner { width: 100%; height: 150px; background: linear-gradient(135deg, #1a73e8, #4285f4); border-radius: 16px; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 16px; box-shadow: 0 4px 10px rgba(26,115,232,0.3); }
        .banner h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .banner p { font-size: 13px; opacity: 0.9; }

        /* Navigation Tabs */
        .nav-tabs { display: flex; gap: 16px; padding: 0 16px; background: #fff; overflow-x: auto; border-bottom: 1px solid #e0e0e0; white-space: nowrap; }
        .nav-tab { padding: 12px 8px; font-size: 14px; font-weight: 500; color: #5f6368; cursor: pointer; border-bottom: 3px solid transparent; }
        .nav-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }

        /* Container & Cards */
        .container { max-width: 800px; margin: 16px auto; padding: 0 16px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .section-title { font-size: 16px; font-weight: 500; color: #202124; }
        .app-count { font-size: 12px; color: #5f6368; }
        
        .app-card { background: #fff; border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .app-card:active { transform: scale(0.98); }
        .app-icon { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: #f1f3f4; }
        .app-info { flex: 1; }
        .app-name { font-size: 16px; font-weight: 500; color: #202124; }
        .app-dev { font-size: 13px; color: #5f6368; margin-top: 2px; }
        
        .download-btn { background: #1a73e8; color: white; padding: 8px 20px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: 500; }

        /* Bottom Play Store Navbar */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid #e0e0e0; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #5f6368; font-size: 12px; font-weight: 500; cursor: pointer; }
        .nav-item.active { color: #1a73e8; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="top-header">
        <div class="brand-title">Iqbal App Hub</div>
    </div>

    <!-- Search Bar (Hidden by default, toggled via bottom search button) -->
    <div class="search-section" id="search-section">
        <input type="text" id="search-input" class="search-box" placeholder="Search apps & games..." oninput="handleSearch()">
    </div>

    <!-- Banner Section -->
    <div class="banner-container" id="banner-container">
        <div class="banner">
            <h2>Iqbal App Hub Pro</h2>
            <p>Explore & Download Secure Cloud-Synced Apps</p>
        </div>
    </div>

    <!-- Sub Tabs -->
    <div class="nav-tabs" id="nav-tabs">
        <div class="nav-tab active" onclick="filterCategory('All', this)">For you</div>
        <div class="nav-tab" onclick="filterCategory('Games', this)">Games</div>
        <div class="nav-tab" onclick="filterCategory('Tools', this)">Tools</div>
        <div class="nav-tab" onclick="filterCategory('Top charts', this)">Top charts</div>
    </div>

    <!-- App List Container -->
    <div class="container">
        <div class="section-header">
            <div class="section-title" id="section-heading">Cloud Synced Applications</div>
            <div class="app-count" id="app-count">0 apps</div>
        </div>
        <div id="app-list">Loading apps from cloud...</div>
    </div>

    <!-- Bottom Play Store Navigation Bar -->
    <div class="bottom-nav">
        <div class="nav-item" onclick="switchNav('Games', this)">
            <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-10 7H8v3H6v-3H3v-2h3V8h2v3h3v2zm4.5 2c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm3-4c-.83 0-1.5-.67-1.5-1.5S17.67 8 18.5 8s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
            Games
        </div>
        <div class="nav-item active" onclick="switchNav('All', this)">
            <svg viewBox="0 0 24 24"><path d="M4 8h4V4H4v4zm6 12h4v-4h-4v4zm-6 0h4v-4H4v4zm0-6h4v-4H4v4zm6 0h4v-4h-4v4zm6-10v4h4V4H4v4zm-6 4h4V4h-4v4zm6 6h4v-4h-4v4zm0 6h4v-4h-4v4z"/></svg>
            Apps
        </div>
        <div class="nav-item" onclick="toggleSearch(this)">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            Search
        </div>
        <div class="nav-item" onclick="switchNav('Tools', this)">
            <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
            Tools
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSy...",
            authDomain: "iqbal-app-store.firebaseapp.com",
            databaseURL: "https://iqbal-app-store-default-rtdb.firebaseio.com",
            projectId: "iqbal-app-store",
            storageBucket: "iqbal-app-store.appspot.com",
            messagingSenderId: "123786659122",
            appId: "1:123786659122:web:df6d6ab40065f77882fab",
            measurementId: "G-DDKV8PASAI"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allApps = [];
        let currentFilter = 'All';
        let searchQuery = '';

        function loadApps() {
            db.ref('apps').on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allApps = Object.keys(data).map(key => ({
                        id: key,
                        ...data[key]
                    }));
                    allApps.reverse();
                    renderApps();
                } else {
                    document.getElementById('app-list').innerHTML = '<p style="padding: 10px;">No apps found in cloud database.</p>';
                    document.getElementById('app-count').innerText = '0 apps';
                }
            });
        }

        function renderApps() {
            const appListEl = document.getElementById('app-list');
            let filtered = allApps;

            // Category filter
            if (currentFilter !== 'All' && currentFilter !== 'Top charts') {
                filtered = filtered.filter(app => (app.appCat || '').toLowerCase() === currentFilter.toLowerCase());
            }

            // Search query filter
            if (searchQuery.trim() !== '') {
                filtered = filtered.filter(app => (app.appName || '').toLowerCase().includes(searchQuery.toLowerCase()) || 
                                                   (app.appDev || '').toLowerCase().includes(searchQuery.toLowerCase()));
            }

            document.getElementById('app-count').innerText = `${filtered.length} apps`;

            if (filtered.length > 0) {
                let html = '';
                filtered.forEach(app => {
                    html += `
                        <div class="app-card">
                            <img src="${app.appIcon || 'https://via.placeholder.com/64'}" class="app-icon" alt="Icon">
                            <div class="app-info">
                                <div class="app-name">${app.appName}</div>
                                <div class="app-dev">${app.appDev} • ${app.appCat || 'Tools'}</div>
                            </div>
                            <a href="${app.appLink}" class="download-btn" target="_blank">Download</a>
                        </div>
                    `;
                });
                appListEl.innerHTML = html;
            } else {
                appListEl.innerHTML = `<p style="padding: 20px; text-align: center; color: #5f6368;">No matching applications found.</p>`;
            }
        }

        function filterCategory(cat, element) {
            currentFilter = cat;
            searchQuery = '';
            document.getElementById('search-input').value = '';
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('section-heading').innerText = cat === 'All' ? 'Cloud Synced Applications' : `${cat} Apps`;
            renderApps();
        }

        function switchNav(cat, element) {
            currentFilter = cat;
            searchQuery = '';
            document.getElementById('search-input').value = '';
            document.getElementById('search-section').style.display = 'none';
            document.getElementById('banner-container').style.display = 'block';
            document.getElementById('nav-tabs').style.display = 'flex';

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('section-heading').innerText = cat === 'All' ? 'Cloud Synced Applications' : `${cat} Apps`;
            renderApps();
        }

        function toggleSearch(element) {
            const searchSec = document.getElementById('search-section');
            const bannerSec = document.getElementById('banner-container');
            const tabsSec = document.getElementById('nav-tabs');

            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');

            if (searchSec.style.display === 'block') {
                searchSec.style.display = 'none';
                bannerSec.style.display = 'block';
                tabsSec.style.display = 'flex';
                searchQuery = '';
                renderApps();
            } else {
                searchSec.style.display = 'block';
                bannerSec.style.display = 'none';
                tabsSec.style.display = 'none';
                document.getElementById('search-input').focus();
                document.getElementById('section-heading').innerText = 'Search Applications';
            }
        }

        function handleSearch() {
            searchQuery = document.getElementById('search-input').value;
            renderApps();
        }

        window.onload = loadApps;
    </script>
</body>
</html>
